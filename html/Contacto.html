<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - CEA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/chatbot.css">
</head>

<body>
    <div class="floating-chat">
        <i class="fas fa-comments"></i>
    </div>

    <div class="chat-window" id="chatWindow">
        <div class="chat-header">
            <h3>Asistente CEA</h3>
            <button id="closeChat"><i class="fas fa-times"></i></button>
        </div>
        <div class="chat-body" id="chatBody">
        </div>
        <div class="chat-footer">
            <input type="text" id="userInput" placeholder="Escribe tu mensaje...">
            <button id="sendBtn"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <header>
        <nav>
            <div class="logo">CEA</div>
            <i class="fas fa-bars menu-toggle" id="menuToggle"></i>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="Nosotros.html">Nosotros</a></li>
                <li><a href="Proyectos.html">Proyectos</a></li>
                <li><a href="Recursos.html">Recursos</a></li>
                <li><a href="Contacto.html" style="font-weight: bold; text-decoration: underline;">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="sub-header header-contacto">
        <h1>Ubicación y Contacto</h1>
    </section>

    <section class="location-section" style="margin-top: 0;">
        <div class="location-container">
            <div class="location-info">
                <h3>CEA - Centro Educativo Ambiental</h3>
                <p><i class="fas fa-map-marker-alt"></i> <strong>Dirección:</strong><br>
                    Av. Beauchef 1327, Santiago Centro<br>
                    (Interior Parque O'Higgins)</p>
                <p><i class="fas fa-phone"></i> <strong>Teléfono:</strong><br>
                    (2) 2827 1299</p>
                <p><i class="fas fa-envelope"></i> <strong>Email:</strong><br>
                    contacto@cea-santiago.cl</p>
            </div>

            <div class="map-container">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3328.965654814603!2d-70.6648453848007!3d-33.46406198077275!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9662c51959e2ebb:0x7280586c410f2f46!2sCEA%20-%20Centro%20Educativo%20Ambiental!5e0!3m2!1ses!2scl!4v1678901234567!5m2!1ses!2scl"
                    width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>

        <div class="contact-form-container"
            style="max-width: 600px; margin: 40px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1);">
            <h3 style="text-align: center; color: #2d5f3f; margin-bottom: 20px;">Envíanos un Mensaje</h3>
            <form id="contactForm">
                <div style="margin-bottom: 15px;">
                    <label for="name" style="display: block; margin-bottom: 5px; color: #333;">Nombre:</label>
                    <input type="text" id="name" name="name" required
                        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="email" style="display: block; margin-bottom: 5px; color: #333;">Email:</label>
                    <input type="email" id="email" name="email" required
                        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="message" style="display: block; margin-bottom: 5px; color: #333;">Mensaje:</label>
                    <textarea id="message" name="message" rows="5" required
                        style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px;"></textarea>
                </div>
                <button type="submit" class="btn-small" style="width: 100%; padding: 12px;">Enviar Mensaje</button>
            </form>
        </div>
    </section>

    <!-- Scripts -->
    <script type="module" src="../js/appwrite.js"></script>
    <script type="module" src="../js/script.js"></script>
    <script type="module" src="../js/chatbot.js"></script>
</body>

</html>
